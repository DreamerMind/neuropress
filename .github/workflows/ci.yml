name: ci

# Lint and test on every push to main and every pull request.
#
# The release workflow (publish.yml) verifies that the *artifact* installs and
# imports; this one verifies that the *code* is correct. Both gate a release:
# publish.yml runs on a tag, by which point these checks have already run on the
# commit being tagged.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      # Mirrors the blocking half of `./run check`. Pinned so a new ruff release
      # cannot fail CI on a commit that did not change; bump it deliberately.
      - name: Lint
        run: uvx ruff@0.15.2 check .

      - name: Format
        run: uvx ruff@0.15.2 format --check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install
        run: |
          set -euo pipefail
          uv venv --python 3.13
          # CPU torch first: the default PyPI wheel bundles CUDA (~2.5 GB) and
          # fills the runner disk. Installing it up front leaves the project
          # install below with the requirement already satisfied.
          uv pip install --python .venv torch --index-url https://download.pytorch.org/whl/cpu
          # `cloud` is needed for collection, not just for coverage:
          # tests/test_cloud_runner.py imports neuropress.cloud.vast_runner,
          # which imports rich at module scope.
          uv pip install --python .venv -e ".[dev,cloud]"

      - name: Test
        # Integration tests need HuggingFace downloads and several minutes; they
        # are additionally gated behind RUN_INTEGRATION inside the module.
        run: .venv/bin/python -m pytest --ignore=tests/integration -q
